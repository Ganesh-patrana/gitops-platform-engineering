apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-sync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Ganesh-patrana/gitops-platform-engineering.git'
    targetRevision: main
    path: infrastructure/crossplane
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
