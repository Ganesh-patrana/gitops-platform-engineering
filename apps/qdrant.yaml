apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qdrant-vector-db
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://qdrant.github.io/qdrant-helm'
    targetRevision: 0.7.5
    chart: qdrant
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ai-infrastructure
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
