apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://open-policy-agent.github.io/gatekeeper/charts'
    targetRevision: 3.14.0
    chart: gatekeeper
    helm:
      parameters:
        - name: auditInterval
          value: "60"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gatekeeper-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
