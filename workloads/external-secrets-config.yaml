apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-store
spec:
  provider:
    gcpsm:
      projectID: ganesh-devops-bootcamp
      auth:
        secretRef:
          secretAccessKeySecretRef:
            name: gcp-secret-manager-creds
            key: secret-manager.json
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: prod-db-password-sync
  namespace: ai-infrastructure
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-store
    kind: ClusterSecretStore
  target:
    name: my-secure-db-secret
  data:
  - secretKey: password
    remoteRef:
      key: prod-db-password
