apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ml-inference-service
  namespace: ai-infrastructure
spec:
  replicas: 5
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause: {}
  selector:
    matchLabels:
      app: ml-inference
  template:
    metadata:
      labels:
        app: ml-inference
    spec:
      containers:
      - name: inference-engine
        image: argoproj/rollouts-demo:green
        ports:
        - containerPort: 8080
