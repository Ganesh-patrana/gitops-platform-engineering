apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-queue
  namespace: ai-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-queue
  template:
    metadata:
      labels:
        app: redis-queue
    spec:
      containers:
      - name: redis
        image: redis:6-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-queue
  namespace: ai-infrastructure
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-queue
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-worker
  namespace: ai-infrastructure
spec:
  replicas: 0
  selector:
    matchLabels:
      app: rag-worker
  template:
    metadata:
      labels:
        app: rag-worker
    spec:
      containers:
      - name: worker
        image: busybox
        command: ["/bin/sh", "-c", "while true; do sleep 30; done"]
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: redis-worker-scaler
  namespace: ai-infrastructure
spec:
  scaleTargetRef:
    name: rag-worker
  minReplicaCount: 0
  maxReplicaCount: 5
  triggers:
  - type: redis
    metadata:
      address: redis-queue.ai-infrastructure.svc.cluster.local:6379
      listName: llm_jobs
      listLength: "2"
